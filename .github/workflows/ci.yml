name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions fixadas por SHA de commit: uma tag pode ser movida (ADR-0025).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Actions pinned by SHA
        run: bash tests/ci/actions-pinned.sh

      - name: Images pinned by digest
        run: bash tests/ci/images-pinned.sh

      - name: Compose ports on localhost
        run: bash tests/ci/compose-ports.sh

      - name: Docker build context
        run: bash tests/ci/dockerignore.sh

      - name: Restore
        run: dotnet restore Ledger.slnx

      - name: Build
        run: dotnet build Ledger.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Ledger.slnx -c Release --no-build

      - name: Restore tools
        run: dotnet tool restore

      # Mutação no domínio do Ledger: quebra o PR abaixo de 80 (ADR-0034).
      - name: Mutation - Ledger domain
        run: dotnet tool run dotnet-stryker --config-file tests/Ledger.UnitTests/stryker-config.json

      - name: CI - mutation step
        run: bash tests/ci/stryker-step.sh

      - name: Docs - identity glossary
        run: bash tests/docs/glossary-identity.sh

      - name: Docs - ledger glossary
        run: bash tests/docs/glossary-ledger.sh

      - name: Docs - superseded ADRs
        run: bash tests/docs/adr-superseded.sh

      - name: Docs - superseded ADRs content
        run: bash tests/docs/adr-superseded.sh content

      - name: Docs - no citation of superseded ADRs
        run: bash tests/docs/adr-references.sh

      - name: Docs - roadmap status
        run: bash tests/docs/roadmap-status.sh

      - name: Docs - guide claims
        run: bash tests/docs/doc-claims.sh guides

      - name: Docs - README claims
        run: bash tests/docs/doc-claims.sh readme

      - name: Smoke - temp directory cleanup
        run: bash tests/smoke/lib-cleanup.sh

      - name: Smoke - compose up
        run: bash tests/smoke/compose-up.sh

      - name: Smoke - compose keycloak
        run: bash tests/smoke/compose-keycloak.sh

      - name: Smoke - migrator failure
        run: bash tests/smoke/compose-migrator-failure.sh

      - name: Smoke - postgres version
        run: bash tests/smoke/compose-postgres-version.sh
