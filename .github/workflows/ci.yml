name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions fixadas por SHA de commit: uma tag pode ser movida (ADR-0055).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Actions pinned by SHA
        run: bash tests/ci/actions-pinned.sh

      - name: Images pinned by digest
        run: bash tests/ci/images-pinned.sh

      - name: Compose ports on localhost
        run: bash tests/ci/compose-ports.sh

      - name: Docker build context
        run: bash tests/ci/dockerignore.sh

      - name: Compose database roles
        run: bash tests/ci/compose-roles.sh

      - name: Personal data redaction in both hosts
        run: bash tests/ci/redaction-enabled.sh

      - name: Compose DDL log
        run: bash tests/ci/compose-ddl-log.sh

      - name: NuGet audit in CI, not in the images
        run: bash tests/ci/nuget-audit-scope.sh

      - name: Restore
        run: dotnet restore Ledger.slnx

      - name: Build
        run: dotnet build Ledger.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Ledger.slnx -c Release --no-build --max-parallel-test-modules 1

      - name: Restore tools
        run: dotnet tool restore

      # Mutação no domínio do Ledger: quebra o PR abaixo de 80 (ADR-0034).
      - name: Mutation - Ledger domain
        run: dotnet tool run dotnet-stryker --config-file tests/Ledger.UnitTests/stryker-config.json

      - name: CI - mutation step
        run: bash tests/ci/stryker-step.sh

      - name: Docs - identity glossary
        run: bash tests/docs/glossary-identity.sh

      - name: Docs - ledger glossary
        run: bash tests/docs/glossary-ledger.sh

      - name: Docs - positions glossary
        run: bash tests/docs/glossary-positions.sh

      - name: Docs - customers glossary
        run: bash tests/docs/glossary-customers.sh

      - name: Docs - audit glossary
        run: bash tests/docs/glossary-audit.sh

      - name: Docs - ADR index
        run: bash tests/docs/adr-index.sh

      - name: Docs - superseded ADRs
        run: bash tests/docs/adr-superseded.sh

      - name: Docs - superseded ADRs content
        run: bash tests/docs/adr-superseded.sh content

      - name: Docs - superseded ADRs cited only with their successor, and ADR links resolve
        run: bash tests/docs/adr-references.sh

      - name: Docs - roadmap status
        run: bash tests/docs/roadmap-status.sh

      - name: Docs - guide claims
        run: bash tests/docs/doc-claims.sh guides

      - name: Docs - README claims
        run: bash tests/docs/doc-claims.sh readme

      - name: Docs - audit claims
        run: bash tests/docs/doc-claims.sh audit

      - name: Docs - decision map cites CodeQL only as out of the delivery
        run: bash tests/docs/doc-claims.sh map

      - name: Docs - flows show the past-instant wait, the 413 and the relay
        run: bash tests/docs/doc-claims.sh flows

      - name: Docs - requests.http tokens
        run: bash tests/docs/http-requests.sh tokens

      - name: Docs - requests.http covers every route of the contract
        run: bash tests/docs/http-requests.sh routes

      - name: Docs - requests.http uses the scope of each route
        run: bash tests/docs/http-requests.sh auth

      - name: Docs - requests.http registers the customer of the README
        run: bash tests/docs/http-requests.sh register

      - name: Smoke - temp directory cleanup
        run: bash tests/smoke/lib-cleanup.sh

      - name: Smoke - instants compared as numbers
        run: bash tests/smoke/lib-instants.sh

      - name: Smoke - compose up
        run: bash tests/smoke/compose-up.sh

      - name: Smoke - compose keycloak
        run: bash tests/smoke/compose-keycloak.sh

      - name: Smoke - migrator failure
        run: bash tests/smoke/compose-migrator-failure.sh

      - name: Smoke - postgres version
        run: bash tests/smoke/compose-postgres-version.sh

      - name: Smoke - compose positions
        run: bash tests/smoke/compose-positions.sh

      - name: Smoke - compose customers
        run: bash tests/smoke/compose-customers.sh
