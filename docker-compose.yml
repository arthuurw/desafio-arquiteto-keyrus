# Ambiente local completo: `docker compose up`.
# Todas as senhas deste arquivo são exclusivas do ambiente local (ADR-0015, ADR-0025).

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d ledger_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Provedor de identidade local (ADR-0012): realm, clients, segredos e usuários de desenvolvimento.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      # Emissor público igual dentro e fora do compose; endpoints de backend seguem o endereço da requisição.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/realm-ledger.json:/opt/keycloak/data/import/realm-ledger.json:ro

  migrator:
    build:
      context: .
      dockerfile: src/Hosts/Migrator/Dockerfile
    environment:
      ConnectionStrings__Migrator: Host=postgres;Database=ledger_db;Username=migrator;Password=migrator_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Hosts/Api/Dockerfile
    environment:
      # Desenvolvimento: os metadados do Keycloak local são servidos por http (ADR-0012).
      ASPNETCORE_ENVIRONMENT: Development
      Identity__Issuer: http://localhost:8180/realms/ledger
      Identity__MetadataAddress: http://keycloak:8080/realms/ledger/.well-known/openid-configuration
      ConnectionStrings__Ledger: Host=postgres;Database=ledger_db;Username=ledger_app;Password=ledger_app_dev
      ConnectionStrings__Customers: Host=postgres;Database=ledger_db;Username=customers_app;Password=customers_app_dev
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: src/Hosts/Worker/Dockerfile
    environment:
      ConnectionStrings__Ledger: Host=postgres;Database=ledger_db;Username=ledger_app;Password=ledger_app_dev
    ports:
      - "8081:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
