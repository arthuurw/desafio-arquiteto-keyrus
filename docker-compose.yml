# Ambiente local completo: `docker compose up`.
# Todas as senhas deste arquivo são exclusivas do ambiente local (ADR-0038, ADR-0025).
# Imagens fixadas por tag exata e digest: uma tag pode ser movida (ADR-0025).
# Portas publicadas só em 127.0.0.1; a porta do host muda por POSTGRES_PORT, MONGO_PORT, KEYCLOAK_PORT, OPENBAO_PORT,
# API_PORT e WORKER_PORT.

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d ledger_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Modelo de leitura (ADR-0006): o init cria `positions_reader` e `positions_writer` (ADR-0035).
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_dev
      # O MongoDB 8 recusa subir em kernel Linux 6.19 a 7.0.13 (SERVER-121912) com o rseq no tcmalloc,
      # o padrão da imagem; com o glibc dono do rseq, o tcmalloc usa cache por thread e o mongod sobe.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Provedor de identidade local (ADR-0012): realm, clients, segredos e usuários de desenvolvimento.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      # Emissor público igual dentro e fora do compose; endpoints de backend seguem o endereço da requisição.
      # Segue KEYCLOAK_PORT: o emissor é o endereço que o navegador e os clients usam.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/realm-ledger.json:/opt/keycloak/data/import/realm-ledger.json:ro

  # Cofre das DEKs e das chaves de HMAC (ADR-0016): modo servidor, storage no volume e auto-unseal estático.
  # NUNCA recrie o volume openbao-data com clientes cadastrados: as DEKs se perdem e os dados ficam ilegíveis.
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server"]
    environment:
      # 32 bytes, exclusivos do ambiente local.
      BAO_STATIC_UNSEAL_KEY: localdev-openbao-static-seal_dev
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    volumes:
      - openbao-data:/openbao/file
      - ./docker/openbao/config.hcl:/openbao/config/config.hcl:ro

  # Inicializa o cofre na primeira subida e confere a configuração nas seguintes, sem trocar chave nenhuma.
  openbao-bootstrap:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    # Root no container de uso único: o volume das credenciais de bootstrap nasce do root.
    user: "0"
    environment:
      BAO_ADDR: http://openbao:8200
      CUSTOMERS_ROLE_ID: customers-api-role_dev
      CUSTOMERS_SECRET_ID: customers-api-secret_dev
      BOOTSTRAP_DIR: /openbao/bootstrap
    volumes:
      - ./docker/openbao:/bootstrap:ro
      - openbao-bootstrap:/openbao/bootstrap
    depends_on:
      openbao:
        condition: service_started
    restart: "no"

  migrator:
    build:
      context: .
      dockerfile: src/Hosts/Migrator/Dockerfile
    environment:
      ConnectionStrings__Migrator: Host=postgres;Database=ledger_db;Username=migrator;Password=migrator_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Hosts/Api/Dockerfile
    environment:
      # Desenvolvimento: os metadados do Keycloak local são servidos por http (ADR-0012).
      ASPNETCORE_ENVIRONMENT: Development
      Identity__Issuer: http://localhost:${KEYCLOAK_PORT:-8180}/realms/ledger
      Identity__MetadataAddress: http://keycloak:8080/realms/ledger/.well-known/openid-configuration
      ConnectionStrings__Ledger: Host=postgres;Database=ledger_db;Username=ledger_app;Password=ledger_app_dev
      ConnectionStrings__Customers: Host=postgres;Database=ledger_db;Username=customers_app;Password=customers_app_dev
      OpenBao__Address: http://openbao:8200
      OpenBao__RoleId: customers-api-role_dev
      OpenBao__SecretId: customers-api-secret_dev
      # Clientes fictícios para os usuários ana e bruno do realm, só neste ambiente.
      Customers__Seed__Enabled: "true"
      # Só leitura no modelo de leitura (ADR-0035).
      ConnectionStrings__Positions: mongodb://positions_reader:positions_reader_dev@mongo:27017/positions?authSource=positions
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      openbao-bootstrap:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: src/Hosts/Worker/Dockerfile
    environment:
      # Role só com as funções do Worker (ADR-0038, ADR-0035): o Worker não faz DML.
      ConnectionStrings__Ledger: Host=postgres;Database=ledger_db;Username=ledger_worker;Password=ledger_worker_dev
      ConnectionStrings__Customers: Host=postgres;Database=ledger_db;Username=customers_worker;Password=customers_worker_dev
      # O Worker é o único que grava no modelo de leitura (ADR-0035).
      ConnectionStrings__Positions: mongodb://positions_writer:positions_writer_dev@mongo:27017/positions?authSource=positions
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  openbao-data:
  openbao-bootstrap:
